<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vector gradients</title>
    <!--
      Linear gradients drawn as SVG gradients: to the bottom (no direction),
      45deg on a wide box, towards a corner, positions in px and a hard edge
      (two positions), stops beyond the box, transparent into a colour (no
      grey on the way), a half-transparent gradient over a background colour,
      a rounded box, a box with an opaque border (the gradient's repeat under
      it), one laid out over the border box under a see-through border, one
      with a single opaque border and transparent unset sides, Bootstrap's
      .bg-gradient (white fading out over a colour: channels of 255 at
      partial alpha, which the background's validator must take), text on a
      gradient (painted), a positioned gradient over a line (which it hides)
      and a see-through one over another (which stays painted).
      Patches ("gradient"): a radial and a repeating gradient, two layers, a
      colour hint, a background size, a content-box origin inside padding
      (CSS repeats where SVG would pad), one under a see-through border, a
      background position, a fixed one, a blended one, one across an inline
      box's two lines, a gradient clipped to text, and a frame's body and
      root gradient (they paint the frame's whole canvas, not their box).
    -->
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; background: rgb(255, 255, 255); }
      #cap { width: 460px; }
      p { margin: 0 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
      .row > div { width: 100px; height: 40px; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": [
          "Gradients drawn as shapes.",
          "Text on a gradient",
          "Hidden under a gradient",
          "Under a see-through gradient",
          "Inline gradient",
          "on two lines",
          "Clipped to text",
          "After the gradients."
        ],
        "vector": {
          "tolerance": 0.005,
          "maxPatchArea": 0.25,
          "unsupported": { "gradient": 14 },
          "hidden": ["Hidden under a gradient", "Inline gradient", "on two lines", "Clipped to text"],
          "visible": [
            "Gradients drawn as shapes.",
            "Text on a gradient",
            "Under a see-through gradient",
            "After the gradients."
          ]
        }
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p>Gradients drawn as shapes.</p>
      <div class="row">
        <div style="background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255))"></div>
        <div style="width: 200px; background: linear-gradient(45deg, rgb(255, 0, 0), rgb(255, 255, 0), rgb(0, 160, 0))"></div>
        <div style="width: 140px; height: 60px; background: linear-gradient(to top right, rgb(0, 0, 0), rgb(255, 255, 255))"></div>
        <div style="background: linear-gradient(to right, rgb(0, 0, 255) 10px, rgb(255, 255, 255) 50% 50%, rgb(255, 0, 0) 50%)"></div>
        <div style="background: linear-gradient(rgb(0, 128, 128) -50%, rgb(255, 128, 0) 150%)"></div>
        <div style="background: linear-gradient(to right, rgba(0, 0, 0, 0), rgb(0, 128, 0))"></div>
        <div style="background: rgb(255, 255, 0) linear-gradient(to right, rgba(255, 0, 0, 0.5), rgba(0, 0, 255, 0.5))"></div>
        <div style="border-radius: 12px; background: linear-gradient(135deg, rgb(128, 0, 128), rgb(255, 192, 203))"></div>
        <div style="box-sizing: border-box; border: 4px solid rgb(0, 0, 0); background: linear-gradient(rgb(255, 255, 255), rgb(0, 0, 255))"></div>
        <div style="box-sizing: border-box; border: 6px solid rgba(0, 0, 0, 0.3); background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)) border-box"></div>
        <div style="box-sizing: border-box; border-style: none none solid none; border-color: transparent transparent rgb(0, 0, 0) transparent; border-bottom-width: 6px; background: linear-gradient(rgb(255, 255, 255), rgb(0, 128, 0))"></div>
        <div style="background: rgb(13, 110, 253) linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0))"></div>
      </div>
      <div class="row">
        <iframe title="body" style="display: block; width: 200px; height: 60px; border: 0" srcdoc="<body style='margin: 8px; background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255))'><div style='height: 10px'></div></body>"></iframe>
        <iframe title="root" style="display: block; width: 200px; height: 60px; border: 0" srcdoc="<html style='background: linear-gradient(rgb(0, 128, 0), rgb(255, 255, 0))'><body style='margin: 8px'><div style='height: 10px'></div></body></html>"></iframe>
      </div>
      <p style="background: linear-gradient(to right, rgb(220, 240, 255), rgb(255, 230, 200))">Text on a gradient</p>
      <p style="position: relative">Hidden under a gradient<span style="position: absolute; left: 0; top: 0; width: 240px; height: 24px; background: linear-gradient(to right, rgb(40, 40, 40), rgb(90, 90, 90))"></span></p>
      <p style="position: relative">Under a see-through gradient<span style="position: absolute; left: 0; top: 0; width: 240px; height: 24px; background: linear-gradient(to right, rgb(40, 40, 40), rgba(90, 90, 90, 0.2))"></span></p>
      <div class="row">
        <div style="background: radial-gradient(rgb(255, 0, 0), rgb(0, 0, 255))"></div>
        <div style="background: repeating-linear-gradient(90deg, rgb(255, 0, 0) 0 10px, rgb(255, 255, 255) 10px 20px)"></div>
        <div style="background: linear-gradient(rgba(255, 0, 0, 0.5), rgba(255, 0, 0, 0.5)), linear-gradient(to right, rgb(0, 0, 255), rgb(255, 255, 255))"></div>
        <div style="background: linear-gradient(rgb(255, 0, 0), 20%, rgb(0, 0, 255))"></div>
        <div style="background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)); background-size: 50% 100%"></div>
        <div style="box-sizing: border-box; padding: 8px; background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)) content-box border-box"></div>
        <div style="box-sizing: border-box; border: 6px solid rgba(0, 0, 0, 0.3); background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255))"></div>
        <div style="background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)) 10px 0"></div>
        <div style="background: linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)) fixed"></div>
        <div style="background: rgb(255, 255, 0) linear-gradient(rgb(255, 0, 0), rgb(0, 0, 255)); background-blend-mode: multiply"></div>
      </div>
      <p><span style="background: linear-gradient(rgb(255, 230, 230), rgb(230, 230, 255))">Inline gradient<br />on two lines</span></p>
      <p style="width: max-content; background: linear-gradient(to right, rgb(255, 0, 0), rgb(0, 0, 255)); -webkit-background-clip: text; background-clip: text; color: transparent">Clipped to text</p>
      <p>After the gradients.</p>
    </main>
  </body>
</html>
