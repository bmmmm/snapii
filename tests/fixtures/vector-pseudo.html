<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vector pseudo</title>
    <!--
      ::before/::after have no DOM node and no box of their own to read: an
      element whose pseudo-element paints (text content, or a box with a
      background) becomes a patch. A clearfix paints nothing and is left
      alone: content "" without a box, Bootstrap 3's " ", or a hidden ".". So is
      one that is fully transparent (a dimmer faded out) or whose only content
      is a WORD JOINER; a half-transparent one still paints.
    -->
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; background: rgb(255, 255, 255); }
      #cap { width: 360px; }
      p, div { margin: 0 0 8px; }
      .sign::before { content: "§ "; }
      .cf::after { content: ""; display: table; clear: both; }
      .bs::before, .bs::after { content: " "; display: table; }
      .pie::after { content: "."; display: block; height: 0; clear: both; visibility: hidden; }
      .bar::after { content: ""; display: block; height: 4px; background: rgb(0, 0, 0); }
      .dim::after { content: ""; display: block; height: 4px; background: rgb(0, 0, 0); opacity: 0; }
      .dimtext::before { content: "x"; opacity: 0; }
      .wj::before { content: "\2060"; }
      .half::after { content: ""; display: block; height: 4px; background: rgb(0, 0, 0); opacity: 0.5; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": [
          "Section sign before",
          "Clearfix text",
          "Bootstrap clearfix",
          "Hidden dot clearfix",
          "Underlined by a pseudo box",
          "Faded out box",
          "Faded out text",
          "Word joiner only",
          "Half faded box"
        ],
        "vector": {
          "maxPatchArea": 0.4,
          "unsupported": { "pseudo": 3 },
          "hidden": ["Section sign before", "Underlined by a pseudo box", "Half faded box"],
          "visible": [
            "Clearfix text",
            "Bootstrap clearfix",
            "Hidden dot clearfix",
            "Faded out box",
            "Faded out text",
            "Word joiner only"
          ]
        }
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p class="sign">Section sign before</p>
      <div class="cf">Clearfix text</div>
      <div class="bs">Bootstrap clearfix</div>
      <div class="pie">Hidden dot clearfix</div>
      <div class="bar">Underlined by a pseudo box</div>
      <div class="dim">Faded out box</div>
      <div class="dimtext">Faded out text</div>
      <div class="wj">Word joiner only</div>
      <div class="half">Half faded box</div>
    </main>
  </body>
</html>
