<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>transform</title>
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; }
    </style>
    <script>
      // A word running through a shadow tree: light-DOM text slotted into a span.
      customElements.define(
        "x-slot",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML = "<span><slot></slot></span>";
          }
        },
      );
    </script>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": [
          "STRASSE UND FLUSS",
          "İSTANBUL İĞDIR",
          "mixed case text",
          "The Quick (Brown) Fox's Tail",
          "Foobar And One",
          "Foo",
          "Bar HomeAbout XYes Cd",
          "Foobar FooBar Foobar Foobar",
          "Foobar Foobar Foobar Foobar",
          "FooBar FooBar Foobar",
          "FooBar Foobar Foo Bar Foobar"
        ],
        "absent": ["Straße", "istanbul", "MIXED", "ONe", "Homeabout", "Xyes", "cd", "Foobar FooBar FooBar"]
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p lang="de" style="text-transform: uppercase">Straße und Fluß</p>
      <p lang="tr" style="text-transform: uppercase">istanbul iğdır</p>
      <p style="text-transform: lowercase">MIXED Case TEXT</p>
      <p style="text-transform: capitalize">the quick (brown) fox's tail</p>
      <!-- A word goes on across an inline boundary: foo<b>bar</b> is one word on the page. -->
      <p style="text-transform: capitalize">foo<b>bar</b> and <i>o</i>ne</p>
      <!-- A <br>, an inline-block, an atomic inline and hidden text are word boundaries: both browsers capitalise after each. -->
      <p style="text-transform: capitalize">foo<br />bar <span style="display: inline-block">home</span><span style="display: inline-block">about</span> x<span style="display: inline-block; width: 10px"></span>yes <span style="display: none">ab</span><b>cd</b></p>
      <!-- One word inside an inline-block; a word broken by the edge of one; hidden text and a padded inline inside a word (both browsers; after an inline-block the engines differ, so that case is not here). -->
      <p style="text-transform: capitalize"><span style="display: inline-block">foo<b>bar</b></span> foo<span style="display: inline-block">bar</span> foo<span style="display: none">x</span>bar foo<b style="padding: 0 3px">bar</b></p>
      <!-- Text slotted through a shadow tree, an empty inline, hidden whitespace and a hidden <br> inside a word: both browsers run the word on. -->
      <p style="text-transform: capitalize">foo<x-slot>bar</x-slot> foo<span></span>bar foo<span style="display: none">x y</span>bar foo<br style="display: none" />bar</p>
      <!-- Laid out but not painted is still a boundary (a visibility:hidden space, a transparent picture); an empty
           absolutely positioned box is none (both browsers; after an empty float they differ, so that case is not here). -->
      <p style="text-transform: capitalize">foo<span style="visibility: hidden"> </span>bar foo<img src="images/quadrants.png" style="opacity: 0; width: 10px; height: 10px" alt="" />bar foo<span style="position: absolute"></span>bar</p>
      <!-- An empty -webkit-inline-box starts a word like an inline-block; out-of-flow text between two words does not,
           hidden or not; a space in a display:contents element does; an empty button made display:contents has no box
           and does not (both browsers). -->
      <p style="text-transform: capitalize">foo<span style="display: -webkit-inline-box"></span>bar foo<span style="position: absolute; visibility: hidden">a b</span>bar foo<span style="display: contents"> </span>bar foo<button style="display: contents"></button>bar</p>
    </main>
  </body>
</html>
