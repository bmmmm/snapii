<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>transform</title>
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": [
          "STRASSE UND FLUSS",
          "İSTANBUL İĞDIR",
          "mixed case text",
          "The Quick (Brown) Fox's Tail",
          "Foobar And One"
        ],
        "absent": ["Straße", "istanbul", "MIXED", "FooBar", "ONe"]
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p lang="de" style="text-transform: uppercase">Straße und Fluß</p>
      <p lang="tr" style="text-transform: uppercase">istanbul iğdır</p>
      <p style="text-transform: lowercase">MIXED Case TEXT</p>
      <p style="text-transform: capitalize">the quick (brown) fox's tail</p>
      <!-- A word goes on across an inline boundary: foo<b>bar</b> is one word on the page. -->
      <p style="text-transform: capitalize">foo<b>bar</b> and <i>o</i>ne</p>
    </main>
  </body>
</html>
