<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>multicolumn</title>
    <!--
      One text node over two balanced columns of 15ch: the first line of the
      second column sits at the same height as the first line of the first.
    -->
    <style>
      body { margin: 0; padding: 20px; }
      #cap { width: 32ch; columns: 2; column-gap: 2ch; font: 20px/1.5 monospace; }
      #cap p { margin: 0; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": ["aaaa bbbb cccc", "dddd eeee ffff", "gggg hhhh iiii", "jjjj kkkk llll"]
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p>aaaa bbbb cccc dddd eeee ffff gggg hhhh iiii jjjj kkkk llll</p>
    </main>
  </body>
</html>
