<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pre</title>
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; }
      pre { font: 16px/1.5 monospace; }
      .pre-wrap { white-space: pre-wrap; }
      .pre-line { white-space: pre-line; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": [
          "  two  spaces",
          "line   two",
          "pre-wrap   keeps   gaps",
          "pre-line folds",
          "spaces",
          "Normal text folds everything.",
          "a",
          "b",
          "cd",
          "e",
          "f",
          "g",
          "h",
          "i",
          "j",
          "k",
          "l",
          "m"
        ]
      }
    </script>
  </head>
  <body>
    <main id="cap">
<pre>  two  spaces
line   two</pre>
      <p class="pre-wrap">pre-wrap   keeps   gaps</p>
      <p class="pre-line">pre-line    folds
spaces</p>
      <p>
        Normal   text
        folds    everything.
      </p>
      <!-- copy.spec: blank lines in one node, two in a row, one in a node of its own between spans; pre-line keeps them too. -->
      <div id="blanks"><pre>a

b


c<span>d</span>

<span>e</span></pre><p class="pre-line">f

g</p></div>
      <!-- copy.spec: newlines outside the pre's own line flow make no blank line (SVG markup, an
           out-of-flow screen-reader span, a textarea's value); an indented pre-line keeps its blank line. -->
      <div id="notblank"><pre>h<svg width="12" height="12">
  <circle cx="6" cy="6" r="5"></circle>
</svg>
i<span style="position: absolute; clip: rect(0 0 0 0)">sr
</span>
j<textarea rows="1" cols="3">t

u</textarea>
k</pre><p class="pre-line">    l

    m</p></div>
    </main>
  </body>
</html>
