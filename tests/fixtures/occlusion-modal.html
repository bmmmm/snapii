<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>occlusion modal</title>
    <!--
      A modal the way dialog libraries open one: pointer-events: none on body,
      auto again on the dialog. The page text inherits none, but it is the
      page that switched it off, not the text: hit-testing still decides, and
      the paragraph under the opaque dialog is dropped.
    -->
    <style>
      body { margin: 0; padding: 20px; font: 16px/24px serif; pointer-events: none; }
      #cap { position: relative; }
      #cap p { margin: 0; }
      .dialog { position: absolute; left: 0; top: 24px; width: 100%; height: 24px; background: #fff; pointer-events: auto; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "options": { "occlusionCheck": true },
        "lines": ["Page text.", "Dialog text."],
        "absent": ["HIDDENBEHIND"]
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p>Page text.</p>
      <p>HIDDENBEHIND the dialog.</p>
      <div class="dialog">Dialog text.</div>
    </main>
  </body>
</html>
