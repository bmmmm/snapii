<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iframe-same-origin</title>
    <!--
      The child page's text is extracted in place, shifted by the frame's
      content box (border 3px + padding 7px). The sandboxed srcdoc frame has an
      opaque origin, so its document is unreadable: counted, not extracted.
    -->
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; }
      iframe { display: block; width: 400px; height: 110px; border: 3px solid #888; padding: 7px; }
      iframe.opaque { height: 40px; }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": ["Parent before.", "Child heading", "Child text with a link.", "Parent after."],
        "absent": ["Sandboxed secret"],
        "links": [{ "text": "a link", "href": "/child-target" }],
        "stats": { "skippedFrames": 1 },
        "vector": {
          "tolerance": 0.005,
          "maxPatchArea": 0.08,
          "unsupported": { "frame": 1 },
          "visible": ["Parent before.", "Child heading", "Parent after."]
        }
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <p>Parent before.</p>
      <iframe src="iframe-child.html" title="child"></iframe>
      <iframe class="opaque" sandbox srcdoc="<p>Sandboxed secret</p>" title="sandboxed"></iframe>
      <p>Parent after.</p>
    </main>
  </body>
</html>
