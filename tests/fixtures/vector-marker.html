<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>vector marker</title>
    <!--
      List markers have no box in the DOM: each becomes a strip patch beside
      its item's first line, not a patch of the whole item (whose text stays
      vector). A list without markers gets none. A list whose text has a shadow
      is a patch per item, and its markers, outside the items, are patches too.
    -->
    <style>
      body { margin: 0; padding: 20px; font: 16px/1.5 serif; background: rgb(255, 255, 255); }
      #cap { width: 360px; }
      ul, ol { margin: 0 0 8px; }
      .plain { list-style: none; }
      .shadow { text-shadow: 1px 1px rgb(200, 0, 0); }
    </style>
    <script type="application/json" id="expect">
      {
        "capture": "#cap",
        "lines": ["First item", "Second item", "One", "Two", "No marker", "Shadowed"],
        "vector": {
          "maxPatchArea": 0.35,
          "unsupported": { "marker": 5, "text-effect": 1 },
          "visible": ["First item", "Second item", "One", "Two", "No marker"]
        }
      }
    </script>
  </head>
  <body>
    <main id="cap">
      <ul><li>First item</li><li>Second item</li></ul>
      <ol><li>One</li><li>Two</li></ol>
      <ul class="plain"><li>No marker</li></ul>
      <ul class="shadow"><li>Shadowed</li></ul>
    </main>
  </body>
</html>
