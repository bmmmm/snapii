# Unit + Playwright layout suites, extension build, web-ext lint and the
# Chromium glue suite.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Playwright's own Firefox and Chromium builds. The Marionette glue
      # suite needs a release Firefox and stays a local gate (pnpm test:glue).
      - run: pnpm exec playwright install --with-deps firefox chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:ext
      # The real extension in that same Chromium, headless; builds dist-chromium/ itself.
      - run: pnpm test:glue:chromium
