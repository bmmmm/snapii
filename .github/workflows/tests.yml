# Unit + Playwright layout suites, extension build, web-ext lint and the
# Chromium glue suite.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push to a pull request makes the run of the commit before it pointless.
# Runs on main are never cancelled: each one is that commit's record.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A run takes about five minutes; a browser that hangs would hold the
    # runner for the default six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Playwright's own Firefox and Chromium builds. The Marionette glue
      # suite needs a release Firefox and stays a local gate (pnpm test:glue).
      - run: pnpm exec playwright install --with-deps firefox chromium
      - run: pnpm test
      # The HTML report and the first-retry traces (playwright.config.ts) are
      # the only way to see why a spec failed or passed on retry only.
      - if: ${{ !cancelled() && (failure() || hashFiles('test-results/**/trace.zip') != '') }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: pnpm build
      - run: pnpm lint:ext
      # The real extension in that same Chromium, headless; builds dist-chromium/ itself.
      - run: pnpm test:glue:chromium
