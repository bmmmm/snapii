<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle"></title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <form id="settings" autocomplete="off">
        <fieldset>
          <legend data-i18n="optionsImageFormat"></legend>
          <label><input type="radio" name="format" value="png" /> <span data-i18n="optionsPng"></span></label>
          <label><input type="radio" name="format" value="jpeg" /> <span data-i18n="optionsJpeg"></span></label>
          <div class="quality">
            <label for="quality" data-i18n="optionsJpegQuality"></label>
            <input id="quality" type="range" min="0" max="100" step="1" />
            <output for="quality" id="quality-value"></output>
          </div>
        </fieldset>

        <fieldset>
          <legend data-i18n="optionsOutput"></legend>
          <label><input type="radio" name="output" value="raster" /> <span data-i18n="optionsOutputRaster"></span></label>
          <label
            ><input type="radio" name="output" value="vector" aria-describedby="output-hint" />
            <span data-i18n="optionsOutputVector"></span
          ></label>
          <p id="output-hint" class="hint" data-i18n="optionsOutputHint"></p>
        </fieldset>

        <fieldset>
          <legend data-i18n="optionsBehavior"></legend>
          <label><input type="checkbox" name="saveAs" /> <span data-i18n="settingSaveAs"></span></label>
          <label
            ><input type="checkbox" name="occlusionCheck" /> <span data-i18n="optionsOcclusion"></span
          ></label>
          <label
            ><input type="checkbox" name="textFragment" /> <span data-i18n="optionsTextFragment"></span
          ></label>
          <label
            ><input type="checkbox" name="removeTrackers" aria-describedby="trackers-hint" />
            <span data-i18n="settingRemoveTrackers"></span
          ></label>
          <p id="trackers-hint" class="hint" data-i18n="optionsTrackersHint"></p>
          <label
            ><input type="checkbox" name="ocr" aria-describedby="ocr-hint output-hint" />
            <span data-i18n="settingOcr"></span
          ></label>
          <p id="ocr-hint" class="hint" data-i18n="optionsOcrHint"></p>
        </fieldset>

        <fieldset>
          <legend data-i18n="optionsSaveLocation"></legend>
          <div class="folder-row">
            <label for="folder" data-i18n="optionsFolder"></label>
            <input
              id="folder"
              name="saveFolder"
              type="text"
              autocomplete="off"
              spellcheck="false"
              data-i18n-placeholder="folderPlaceholder"
              aria-describedby="folder-hint folder-error"
            />
          </div>
          <!-- Filled by options.ts: the rule names the browser the build is for. -->
          <p id="folder-hint" class="hint"></p>
          <p id="folder-error" class="hint" role="alert" hidden></p>
        </fieldset>

        <div class="actions">
          <button type="button" id="reset" data-i18n="optionsReset"></button>
          <p id="status" role="status" aria-live="polite"></p>
        </div>
      </form>

      <!-- Not part of the form: the browser stores the shortcut itself (commands.update), not storage.sync. -->
      <fieldset id="shortcut">
        <legend data-i18n="optionsShortcut"></legend>
        <div class="shortcut-row">
          <label for="shortcut-input" data-i18n="commandCapture"></label>
          <input
            id="shortcut-input"
            type="text"
            readonly
            disabled
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="optionsShortcutNone"
            aria-describedby="shortcut-hint"
          />
          <button type="button" id="shortcut-reset" data-i18n="optionsShortcutReset"></button>
          <button type="button" id="shortcut-settings" hidden data-i18n="optionsShortcutSettings"></button>
        </div>
        <p id="shortcut-hint" class="hint" data-i18n="optionsShortcutHint"></p>
        <p id="shortcut-status" role="status" aria-live="polite"></p>
      </fieldset>

      <footer id="about" class="hint"></footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
