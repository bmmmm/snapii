<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>snapii</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon.svg" width="20" height="20" alt="" />
        <h1>snapii</h1>
      </header>

      <!-- aria-busy until the page has been asked whether snapii can run there. -->
      <button type="button" id="capture" class="primary" aria-busy="true">
        <span data-i18n="popupCapture"></span>
        <kbd id="capture-shortcut" aria-hidden="true"></kbd>
      </button>
      <p id="status" role="status" aria-live="polite"></p>

      <!-- Disabled until the stored values are shown, so a click cannot be overwritten by the load. -->
      <fieldset id="toggles" disabled>
        <legend data-i18n="popupQuickSettings"></legend>
        <label><input type="checkbox" name="ocr" /> <span data-i18n="settingOcr"></span></label>
        <label><input type="checkbox" name="textFragment" /> <span data-i18n="popupTextFragment"></span></label>
        <label><input type="checkbox" name="removeTrackers" /> <span data-i18n="settingRemoveTrackers"></span></label>
        <label><input type="checkbox" name="saveAs" /> <span data-i18n="settingSaveAs"></span></label>
        <label class="folder">
          <span data-i18n="popupFolder"></span>
          <input
            id="folder"
            type="text"
            name="saveFolder"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="folderPlaceholder"
            aria-describedby="folder-error"
          />
        </label>
        <p id="folder-error" role="alert" hidden></p>
      </fieldset>

      <button type="button" id="options" class="plain" data-i18n="popupAllSettings"></button>

      <footer id="about"></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
